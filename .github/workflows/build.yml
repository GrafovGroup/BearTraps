name: Build and verify WHC website
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: whc-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Dependency vulnerability audit
        run: pnpm audit --audit-level=high
      - name: Verify optional WHC PHP bridge
        run: |
          php --version
          php -l integrations/whc/rfq.php
          php tests/whc-bridge.php
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run check:catalogue
      - run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: node scripts/check-export.mjs
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: screenshots/
          retention-days: 14
      - name: Package WHC upload
        run: cd out && zip -r ../beartraps-whc.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: beartraps-whc
          path: beartraps-whc.zip
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: whc-rfq-bridge-disabled
          path: integrations/whc/rfq.php
          retention-days: 14
